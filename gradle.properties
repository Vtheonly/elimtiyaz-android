# Build-env tuning (13th session, 2026-08-31): the 2-CPU / 4 GB container
# OOM-crashed the Gradle daemon with the previous 2 GB heap + parallel
# settings ("daemon disappeared unexpectedly" mid-compile). 1.5 GB heap,
# no parallel execution and the in-process Kotlin compiler keep the whole
# ./gradlew test pipeline inside the memory budget (219/219 green).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configuration-cache=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
