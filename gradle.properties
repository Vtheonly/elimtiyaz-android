# El-Imtiyaz Android — top-level Gradle properties

# JVM target — Kotlin 2.0 + AGP 8.7 require JDK 17+
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# KSP — fast incremental
ksp.incremental=true

# Hilt
dagger.hilt.android.disableAndroidResourcesAdapters=false

# Performance
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true

# Suppress noisy warnings about maven publish
android.experimental.lint.missingBaselineIsEmptyBaseline=true
